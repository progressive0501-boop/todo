<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TODO</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f13;
      --surface: #1a1a23;
      --surface2: #22222e;
      --border: #2e2e3e;
      --accent: #7c6aff;
      --accent-hover: #9a8bff;
      --danger: #ff5a5a;
      --text: #e8e8f0;
      --text-muted: #888899;
      --done-text: #55556a;
      --radius: 12px;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 48px 16px 80px;
    }

    .app {
      width: 100%;
      max-width: 600px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      margin-bottom: 32px;
      background: linear-gradient(135deg, #fff 30%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Input */
    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    #new-todo {
      flex: 1;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 0.95rem;
      padding: 12px 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    #new-todo:focus { border-color: var(--accent); }
    #new-todo::placeholder { color: var(--text-muted); }

    .btn-add {
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      color: #fff;
      cursor: pointer;
      font-size: 1.4rem;
      line-height: 1;
      padding: 0 18px;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-add:hover { background: var(--accent-hover); }
    .btn-add:active { transform: scale(0.95); }

    /* Filters */
    .filters {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }

    .filter-btn {
      background: transparent;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 5px 12px;
      text-transform: uppercase;
      transition: all 0.15s;
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* Stats */
    .stats {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-left: auto;
      align-self: center;
    }

    /* List */
    #todo-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .todo-item {
      align-items: center;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      gap: 12px;
      padding: 14px 16px;
      transition: border-color 0.15s, opacity 0.2s;
      animation: slide-in 0.18s ease;
    }
    .todo-item:hover { border-color: var(--accent); }
    .todo-item.done { opacity: 0.5; }

    @keyframes slide-in {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Checkbox */
    .check {
      appearance: none;
      -webkit-appearance: none;
      background: var(--surface2);
      border: 2px solid var(--border);
      border-radius: 50%;
      cursor: pointer;
      flex-shrink: 0;
      height: 22px;
      outline: none;
      position: relative;
      transition: all 0.15s;
      width: 22px;
    }
    .check:hover { border-color: var(--accent); }
    .check:checked {
      background: var(--accent);
      border-color: var(--accent);
    }
    .check:checked::after {
      content: '';
      position: absolute;
      top: 3px; left: 6px;
      width: 6px; height: 10px;
      border: 2px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg);
    }

    /* Text */
    .todo-text {
      background: transparent;
      border: none;
      color: var(--text);
      flex: 1;
      font-size: 0.95rem;
      outline: none;
      transition: color 0.2s;
    }
    .todo-item.done .todo-text {
      color: var(--done-text);
      text-decoration: line-through;
    }
    .todo-text:focus { color: var(--text); }

    /* Priority dot */
    .priority {
      background: var(--border);
      border: none;
      border-radius: 50%;
      cursor: pointer;
      flex-shrink: 0;
      height: 10px;
      outline: none;
      transition: background 0.15s;
      width: 10px;
    }
    .priority[data-p="1"] { background: #ffb74d; }
    .priority[data-p="2"] { background: #ff5a5a; }

    /* Delete */
    .btn-del {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      flex-shrink: 0;
      font-size: 1rem;
      line-height: 1;
      opacity: 0;
      padding: 2px 4px;
      transition: color 0.15s, opacity 0.15s;
    }
    .todo-item:hover .btn-del { opacity: 1; }
    .btn-del:hover { color: var(--danger); }

    /* Empty state */
    .empty {
      color: var(--text-muted);
      font-size: 0.9rem;
      padding: 48px 0;
      text-align: center;
    }

    /* Clear completed */
    .bottom-bar {
      display: flex;
      justify-content: flex-end;
      margin-top: 16px;
    }
    .btn-clear {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 4px 0;
      transition: color 0.15s;
    }
    .btn-clear:hover { color: var(--danger); }
    .btn-clear:disabled { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
<div class="app">
  <h1>TODO</h1>

  <div class="input-row">
    <input id="new-todo" type="text" placeholder="新しいタスクを入力… (Enter で追加)" autocomplete="off">
    <button class="btn-add" id="btn-add" title="追加">+</button>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-filter="all">すべて</button>
    <button class="filter-btn" data-filter="active">未完了</button>
    <button class="filter-btn" data-filter="done">完了</button>
    <span class="stats" id="stats"></span>
  </div>

  <ul id="todo-list"></ul>

  <div class="bottom-bar">
    <button class="btn-clear" id="btn-clear">完了済みを削除</button>
  </div>
</div>

<script>
  const STORAGE_KEY = 'todo-app-v1';

  let todos = load();
  let filter = 'all';

  function load() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { return []; }
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
  }

  function newTodo(text) {
    return { id: Date.now() + Math.random(), text, done: false, priority: 0 };
  }

  function addTodo() {
    const input = document.getElementById('new-todo');
    const text = input.value.trim();
    if (!text) return;
    todos.unshift(newTodo(text));
    input.value = '';
    save();
    render();
  }

  function toggleDone(id) {
    const t = todos.find(t => t.id === id);
    if (t) { t.done = !t.done; save(); render(); }
  }

  function deleteTodo(id) {
    todos = todos.filter(t => t.id !== id);
    save();
    render();
  }

  function cyclePriority(id) {
    const t = todos.find(t => t.id === id);
    if (t) { t.priority = (t.priority + 1) % 3; save(); render(); }
  }

  function updateText(id, text) {
    const t = todos.find(t => t.id === id);
    if (t) { t.text = text; save(); }
  }

  function clearDone() {
    todos = todos.filter(t => !t.done);
    save();
    render();
  }

  function filtered() {
    if (filter === 'active') return todos.filter(t => !t.done);
    if (filter === 'done')   return todos.filter(t => t.done);
    return todos;
  }

  function render() {
    const list = document.getElementById('todo-list');
    const items = filtered();

    // Stats
    const total  = todos.length;
    const doneN  = todos.filter(t => t.done).length;
    document.getElementById('stats').textContent =
      total ? `${doneN} / ${total} 完了` : '';

    // Clear button
    const clearBtn = document.getElementById('btn-clear');
    clearBtn.disabled = !todos.some(t => t.done);

    // Empty state
    if (!items.length) {
      list.innerHTML = `<div class="empty">${total ? 'タスクなし' : 'タスクを追加しよう'}</div>`;
      return;
    }

    list.innerHTML = '';
    items.forEach(todo => {
      const li = document.createElement('li');
      li.className = 'todo-item' + (todo.done ? ' done' : '');
      li.dataset.id = todo.id;

      // Checkbox
      const chk = document.createElement('input');
      chk.type = 'checkbox';
      chk.className = 'check';
      chk.checked = todo.done;
      chk.addEventListener('change', () => toggleDone(todo.id));

      // Priority dot
      const dot = document.createElement('button');
      dot.className = 'priority';
      dot.dataset.p = todo.priority;
      dot.title = ['優先度なし','優先度: 中','優先度: 高'][todo.priority];
      dot.addEventListener('click', () => cyclePriority(todo.id));

      // Text
      const txt = document.createElement('input');
      txt.type = 'text';
      txt.className = 'todo-text';
      txt.value = todo.text;
      txt.addEventListener('change', e => updateText(todo.id, e.target.value));
      txt.addEventListener('keydown', e => { if (e.key === 'Enter') txt.blur(); });

      // Delete
      const del = document.createElement('button');
      del.className = 'btn-del';
      del.textContent = '×';
      del.title = '削除';
      del.addEventListener('click', () => deleteTodo(todo.id));

      li.append(dot, chk, txt, del);
      list.appendChild(li);
    });
  }

  // Events
  document.getElementById('btn-add').addEventListener('click', addTodo);
  document.getElementById('new-todo').addEventListener('keydown', e => {
    if (e.key === 'Enter') addTodo();
  });
  document.getElementById('btn-clear').addEventListener('click', clearDone);

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      filter = btn.dataset.filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    });
  });

  render();
</script>
</body>
</html>
